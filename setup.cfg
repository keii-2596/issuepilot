[metadata]
name = issuepilot
version = 0.1.0
description = A reviewable AI agent that finds and fixes GitHub issues.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = IssuePilot contributors

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    issuepilot = issuepilot.cli:main

[options.package_data]
issuepilot =
    web_static/*
    web_static/assets/*
